spring:
  application:
    name: plant-care-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  file-storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${UPLOAD_DIR:./uploads}
