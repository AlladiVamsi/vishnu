name: Spring Boot CI/CD Pipeline

# When should pipeline run?
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    # GitHub virtual machine
    runs-on: ubuntu-latest

    steps:

      # Step 1: Download source code
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # Step 2: Install Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # Step 3: Run tests
      - name: Run Tests
        run: mvn test


      # Step 4: Build Spring Boot application
      - name: Build Application
        run: mvn clean package -DskipTests


      # Step 5: Check generated JAR
      - name: List Target Files
        run: ls -la target/

        - name: Setup Java 21
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: '21'
    cache: maven